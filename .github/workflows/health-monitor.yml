name: health-monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEALTH_MAX_CI_AGE_HOURS: "168"

    steps:
      - name: Check runner and latest CI health
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Health monitor is running on a self-hosted runner."
          Write-Host "Job startup proves the runner can pick up work; GitHub runner-list API requires broader repository administration permissions than GITHUB_TOKEN provides."

          Write-Host "Checking latest completed main push run for tests workflow"
          $runsJson = gh run list `
            --repo "$env:REPO" `
            --workflow tests `
            --branch main `
            --event push `
            --limit 10 `
            --json databaseId,status,conclusion,createdAt,url

          $runs = $runsJson | ConvertFrom-Json
          $latestRun = $runs | Where-Object { $_.status -eq "completed" } | Select-Object -First 1

          if ($null -eq $latestRun) {
            Write-Error "No completed main push run found for tests workflow."
            exit 1
          }

          $databaseId = $latestRun.databaseId
          $status = $latestRun.status
          $conclusion = $latestRun.conclusion
          $createdAt = [DateTimeOffset]::Parse(
            [string]$latestRun.createdAt,
            [Globalization.CultureInfo]::InvariantCulture,
            [Globalization.DateTimeStyles]::AssumeUniversal
          ).UtcDateTime
          $url = $latestRun.url

          Write-Host "Latest completed tests run: $url"
          Write-Host "database_id=$databaseId status=$status conclusion=$conclusion created_at=$($createdAt.ToString('o'))"

          if ($conclusion -ne "success") {
            Write-Error "Latest completed main tests run is not green: conclusion=$conclusion, url=$url"
            exit 1
          }

          $ageHours = [int](([DateTime]::UtcNow - $createdAt).TotalHours)
          Write-Host "Latest green CI age: ${ageHours}h"

          if ($ageHours -gt [int]$env:HEALTH_MAX_CI_AGE_HOURS) {
            Write-Error "Latest green main tests run is stale: ${ageHours}h > $env:HEALTH_MAX_CI_AGE_HOURS h"
            exit 1
          }

          Write-Host "Health monitor passed."
