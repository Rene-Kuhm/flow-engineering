name: health-monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEALTH_MAX_CI_AGE_HOURS: "168"

    steps:
      - name: Check runner and latest CI health
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking self-hosted runner status for $env:REPO"
          $runners = gh api "repos/$env:REPO/actions/runners" | ConvertFrom-Json
          $onlineRunners = @(
            $runners.runners |
              Where-Object { $_.name -like "*flow-engineering*" -and $_.status -eq "online" }
          )

          if ($onlineRunners.Count -lt 1) {
            Write-Error "No online flow-engineering self-hosted runner found."
            $runners.runners |
              Select-Object name,status,busy,@{Name="labels";Expression={($_.labels.name -join ",")}} |
              Format-Table -AutoSize
            exit 1
          }

          Write-Host "Online flow-engineering runner count: $($onlineRunners.Count)"

          Write-Host "Checking latest completed main push run for tests workflow"
          $latestRunFields = gh run list `
            --repo "$env:REPO" `
            --workflow tests `
            --branch main `
            --event push `
            --limit 10 `
            --json databaseId,status,conclusion,createdAt,url `
            --jq 'map(select(.status == "completed"))[0] | [.databaseId,.status,.conclusion,.createdAt,.url] | @tsv'

          if ([string]::IsNullOrWhiteSpace($latestRunFields)) {
            Write-Error "No completed main push run found for tests workflow."
            exit 1
          }

          $fields = $latestRunFields -split "`t"
          $databaseId = $fields[0]
          $status = $fields[1]
          $conclusion = $fields[2]
          $createdAtRaw = $fields[3]
          $url = $fields[4]

          Write-Host "Latest completed tests run: $url"
          Write-Host "database_id=$databaseId status=$status conclusion=$conclusion created_at=$createdAtRaw"

          if ($conclusion -ne "success") {
            Write-Error "Latest completed main tests run is not green: conclusion=$conclusion, url=$url"
            exit 1
          }

          $createdAt = [DateTimeOffset]::Parse($createdAtRaw).UtcDateTime
          $ageHours = [int](([DateTime]::UtcNow - $createdAt).TotalHours)
          Write-Host "Latest green CI age: ${ageHours}h"

          if ($ageHours -gt [int]$env:HEALTH_MAX_CI_AGE_HOURS) {
            Write-Error "Latest green main tests run is stale: ${ageHours}h > $env:HEALTH_MAX_CI_AGE_HOURS h"
            exit 1
          }

          Write-Host "Health monitor passed."
