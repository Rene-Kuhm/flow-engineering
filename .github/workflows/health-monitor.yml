name: health-monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEALTH_MAX_CI_AGE_HOURS: "168"

    steps:
      - name: Check runner and latest CI health
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking self-hosted runner status for ${REPO}"
          runners_json="$(gh api "repos/${REPO}/actions/runners")"
          online_runner_count="$(
            jq '[.runners[]
              | select(.name | contains("flow-engineering"))
              | select(.status == "online")
            ] | length' <<< "${runners_json}"
          )"

          if [[ "${online_runner_count}" -lt 1 ]]; then
            echo "::error::No online flow-engineering self-hosted runner found."
            jq '.runners[] | {name, status, busy, labels: [.labels[].name]}' <<< "${runners_json}"
            exit 1
          fi

          echo "Online flow-engineering runner count: ${online_runner_count}"

          echo "Checking latest main push run for tests workflow"
          latest_run="$(
            gh run list \
              --repo "${REPO}" \
              --workflow tests \
              --branch main \
              --event push \
              --limit 1 \
              --json databaseId,status,conclusion,createdAt,url \
              --jq '.[0]'
          )"

          if [[ -z "${latest_run}" || "${latest_run}" == "null" ]]; then
            echo "::error::No main push run found for tests workflow."
            exit 1
          fi

          status="$(jq -r '.status' <<< "${latest_run}")"
          conclusion="$(jq -r '.conclusion' <<< "${latest_run}")"
          created_at="$(jq -r '.createdAt' <<< "${latest_run}")"
          url="$(jq -r '.url' <<< "${latest_run}")"

          echo "Latest tests run: ${url}"
          echo "status=${status} conclusion=${conclusion} created_at=${created_at}"

          if [[ "${status}" != "completed" || "${conclusion}" != "success" ]]; then
            echo "::error::Latest main tests run is not green: status=${status}, conclusion=${conclusion}, url=${url}"
            exit 1
          fi

          age_hours="$(
            CREATED_AT="${created_at}" python - <<'PY'
          import datetime as dt
          import os

          created = dt.datetime.fromisoformat(os.environ["CREATED_AT"].replace("Z", "+00:00"))
          now = dt.datetime.now(dt.UTC)
          print(int((now - created).total_seconds() // 3600))
          PY
          )"

          echo "Latest green CI age: ${age_hours}h"

          if [[ "${age_hours}" -gt "${HEALTH_MAX_CI_AGE_HOURS}" ]]; then
            echo "::error::Latest green main tests run is stale: ${age_hours}h > ${HEALTH_MAX_CI_AGE_HOURS}h"
            exit 1
          fi

          echo "Health monitor passed."
