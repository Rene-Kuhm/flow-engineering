name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Type check with mypy
        run: uv run mypy src

      - name: Run tests
        env:
          PYTEST_BASETEMP: ${{ runner.temp }}\pytest-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          Remove-Item -LiteralPath $env:PYTEST_BASETEMP -Recurse -Force -ErrorAction SilentlyContinue
          uv run pytest --basetemp="$env:PYTEST_BASETEMP" --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
