name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command ". '{0}'"
    env:
      CHECKOUT_DIR: checkout-${{ github.run_id }}-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ env.CHECKOUT_DIR }}
          clean: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: uv run ruff check src tests

      - name: Type check with mypy
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: uv run mypy src

      - name: Run tests
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          PYTEST_BASETEMP: ${{ runner.temp }}\pytest-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          Remove-Item -LiteralPath $env:PYTEST_BASETEMP -Recurse -Force -ErrorAction SilentlyContinue
          uv run pytest --basetemp="$env:PYTEST_BASETEMP" --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Expose Git Unix tools for Codecov
        if: matrix.python-version == '3.12'
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.CHECKOUT_DIR }}/coverage.xml
          fail_ci_if_error: false
