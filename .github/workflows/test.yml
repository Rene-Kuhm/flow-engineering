name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command ". '{0}'"
    env:
      CHECKOUT_DIR: checkout-${{ github.run_id }}-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ env.CHECKOUT_DIR }}
          clean: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: uv run ruff check src tests

      - name: Security audit with ruff
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: >
          uv run ruff check
          --select S102,S105,S106,S107,S108,S301,S302,S303,S304,S305,S306,S307,S308,S310,S312,S313,S314,S315,S316,S317,S318,S319,S321,S323,S501,S502,S503,S504,S505,S506,S507,S508,S509,S601,S602,S604,S605,S606,S608,S609,S610,S611,S612
          src scripts

      - name: Type check with mypy
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: uv run mypy src

      - name: Run tests
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          PYTEST_BASETEMP: ${{ runner.temp }}\pytest-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          Remove-Item -LiteralPath $env:PYTEST_BASETEMP -Recurse -Force -ErrorAction SilentlyContinue
          uv run pytest --basetemp="$env:PYTEST_BASETEMP" --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Expose Git Unix tools for Codecov
        if: matrix.python-version == '3.12'
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}\codecov-gitconfig
          HOME: ${{ runner.temp }}
        with:
          files: ${{ env.CHECKOUT_DIR }}/coverage.xml
          fail_ci_if_error: false
