[project]
name = "flow-engineering"
version = "1.2.0"
description = "Flow Engineering orchestrator for Agentic & Context-Driven development"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "insyd"}]
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "watchdog>=4.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "numpy>=2.5.0",
]

[project.scripts]
flow = "flow_engineering.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

# Optional ML extras for vector-semantic-search (REQ-17, REQ-19).
# Installing [vectors] enables ``HybridBackend.mem_search_semantic`` /
# ``mem_search_hybrid`` and the ``flow search --semantic`` / ``flow reindex``
# CLI subcommands. Default install stays torch-free and loads instantly.
#
# Activation is BOTH this extra AND ``FLOW_VECTOR_SEARCH=1`` (see spec #142).
# CPU-only torch install: prefix with
# ``pip install --index-url https://download.pytorch.org/whl/cpu torch``
# before running ``pip install -e .[vectors]``.
vectors = [
    "sqlite-vec>=0.1.0,<0.2",      # pinned <0.2 to avoid int8 KNN API churn (design D9)
    "sentence-transformers>=2.0",  # all-MiniLM-L6-v2 + future swaps
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_engineering"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# ``cli/__init__.py`` performs lazy submodule imports AFTER the ``main`` Click
# group is defined (v1.3-cli-split design §6). Each submodule executes
# ``from flow_engineering.cli import main`` at module (decorator-evaluation)
# time, so ``main`` MUST already exist in the cli namespace before the
# submodules are imported. Relocating these imports to the top of the file
# would break that circular-import seam at runtime (ImportError on a
# partially-initialised ``flow_engineering.cli`` module). E402 is therefore
# scoped-off for this one file; the deliberate placement is documented inline
# on each import.
"src/flow_engineering/cli/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Optional ML extras (REQ-17, REQ-19) ship without library stubs / py.typed
# markers. They are gated behind the ``[vectors]`` extra + FLOW_VECTOR_SEARCH=1
# at runtime, so the optional-import sites already handle ImportError. Telling
# mypy to ignore_missing_imports is the standard pattern for 3rd-party deps
# without stubs and avoids forcing the test suite to install the extra just to
# type-check the optional code paths.
#
# `yaml` (PyYAML) is also used at runtime without bundled type stubs; the
# library is small, stable, and ubiquitous, so we don't gate it behind an
# extra — we just opt out of strict import checking for it.
module = ["torch", "sentence_transformers", "sqlite_vec", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The cli submodules import the ``main`` Click group from the package
# ``__init__`` at module (decorator-evaluation) time, forming the intentional
# import cycle documented in v1.3-cli-split design §6 (``__init__`` lazily
# imports the submodules AFTER defining ``main``). mypy cannot resolve
# ``main``'s type across this cycle, so it emits ``has-type`` on the first use
# of ``main`` in each submodule and, as a knock-on, ``untyped-decorator`` on
# every ``@main.group()`` / ``@<group>.command()`` -- the click decorators ARE
# typed; they only look untyped because ``main`` degrades to ``Any`` through
# the cycle. Both are false positives caused solely by the cycle. Scope the two
# codes off for the cli submodules only; the package ``__init__`` (where
# ``main`` resolves correctly) keeps full strict checking.
module = ["flow_engineering.cli.*"]
disallow_untyped_decorators = false
disable_error_code = ["has-type"]

[tool.flow_engineering.prompts]
directory = "prompts"

[tool.flow_engineering]
# REQ-V1.2.3 (PR#2c): project-pinned minimum sdd-* skill versions enforced
# at `flow apply` / `flow verify` / `flow archive` startup by
# `flow_engineering.opencode_skill_catalog.enforce_min_skill_versions()`.
# Operators running an outdated OpenCode runtime (e.g., sdd-apply 2.5 vs
# the codebase's 3.0 minimum) get exit code 4 + a remediation message
# pointing at `pip install --upgrade gentle-ai`. Mirrors the
# `[tool.flow_engineering.prompts]` precedent on the section above.
min_sdd_skill_versions = {sdd-explore = "3.0", sdd-propose = "3.0", sdd-spec = "3.0", sdd-design = "3.0", sdd-tasks = "3.0", sdd-apply = "3.0", sdd-verify = "3.0", sdd-archive = "3.0"}

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/bdd"
pythonpath = ["src"]

[tool.coverage.report]
# REQ-V1.3.2 (PR #N): hard-fail pytest when line coverage drops below 80%.
# Mirrored in .github/workflows/test.yml as `--cov-fail-under=80` (belt +
# suspenders per design ADR-b.2). Threshold can be raised to 90% in the
# `chore/coverage-floor-90` follow-up once baseline is confirmed safe.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
