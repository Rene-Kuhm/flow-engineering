[project]
name = "flow-engineering"
version = "0.1.0"
description = "Flow Engineering orchestrator for Agentic & Context-Driven development"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "insyd"}]
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "watchdog>=4.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "numpy>=2.5.0",
]

[project.scripts]
flow = "flow_engineering.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_engineering"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/bdd"
pythonpath = ["src"]
